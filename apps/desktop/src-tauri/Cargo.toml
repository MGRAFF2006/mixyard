[package]
name = "mixyard-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Mixyard shared console and independent runtime desktop client"

# Keep the desktop workspace separate; dependencies point desktop → headless core only.
[workspace]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
mixyard-desktop-control = { path = "../native-control" }
mixyard = { path = "../../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
