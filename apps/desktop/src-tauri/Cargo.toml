[package]
name = "mixyard-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Mixyard read-only local runtime desktop client"

# Keep the desktop workspace separate; dependencies point desktop → headless core only.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mixyard = { path = "../../.." }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
