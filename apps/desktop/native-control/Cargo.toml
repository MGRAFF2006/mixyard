[package]
name = "mixyard-desktop-control"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
sha2 = "0.10"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
