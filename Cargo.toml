[package]
name = "mixyard"
default-run = "mixyard"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read-only configuration validation and dry-run audio routing policy"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP parsing/framing stays in Hyper; no handwritten wire parser.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
getrandom = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO"] }
