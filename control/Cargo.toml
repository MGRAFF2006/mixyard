[package]
name = "mixyard-control"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Keep transport dependencies out of the core and native runtime build graphs.
[workspace]

[dependencies]
mixyard = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
getrandom = "0.4"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util", "signal"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
