name: qualification-linux
description: Explicit Linux payload from .github/workflows/qualification.yml / linux
runs:
  using: composite
  steps:
  - uses: actions/checkout@v5
  - uses: actions/setup-python@v6
    with:
      python-version: '3.13'
  - name: Native Linux CLI imports and help only
    run: python3 -B adapters/linux/mixyard_linux.py --help
    shell: python3 ${{ github.workspace }}/.github/ci/lane_boundary.py shell bash {0}
  - name: Linux offline model tests (no PipeWire routing)
    run: python3 -B adapters/linux/test_linux.py
    shell: python3 ${{ github.workspace }}/.github/ci/lane_boundary.py shell bash {0}
