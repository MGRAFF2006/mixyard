name: macos-workers
description: Original Linux fixture payload; isolated checkout and lane deadline are owned by the caller.
runs:
  using: composite
  steps:
  - uses: actions/checkout@v4
  - name: Portable SPSC/PCM and Apple ABI synthetic ingress
    run: bash adapters/macos/worker-check.sh
    shell: bash
  - name: Compile actual process tap path (never execute capture/render)
    if: runner.os == 'macOS'
    run: bash adapters/macos/build.sh
    shell: bash
  - name: Record proof boundary
    if: always()
    shell: bash
    run: |
      echo 'Synthetic PCM/SPSC and Apple SDK checks only. No physical audio, HAL install, permissions or default-device changes.' >> "$GITHUB_STEP_SUMMARY"
      echo 'Rust engine linkage, clock adaptation, system-broker authority, external virtual inputs, fidelity and latency remain unqualified. backendAvailable=false audioApplied=false.' >> "$GITHUB_STEP_SUMMARY"
