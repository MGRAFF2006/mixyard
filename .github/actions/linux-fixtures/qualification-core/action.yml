name: qualification-core
description: Explicit Linux payload from .github/workflows/qualification.yml / core
runs:
  using: composite
  steps:
  - uses: dtolnay/rust-toolchain@stable
    if: runner.os == 'Linux'
    with:
      components: rustfmt, clippy
  - uses: actions/checkout@v4
  - uses: actions/setup-python@v5
    with:
      python-version: '3.13'
  - name: Disk prerequisite (at least 10 GiB)
    shell: python3 ${{ github.workspace }}/.github/ci/lane_boundary.py shell python {0}
    run: |
      import shutil
      free = shutil.disk_usage('.').free
      print(f'Available: {free / 2**30:.1f} GiB')
      if free < 10 * 2**30:
          raise SystemExit('BLOCKED: less than 10 GiB free before build')
  - name: Root core package tests only
    run: cargo test --locked --manifest-path Cargo.toml --package mixyard
    shell: python3 ${{ github.workspace }}/.github/ci/lane_boundary.py shell bash {0}
  - name: Build policy CLI for independent black-box checks
    run: cargo build --locked --manifest-path Cargo.toml --package mixyard
    shell: python3 ${{ github.workspace }}/.github/ci/lane_boundary.py shell bash {0}
  - name: Independent policy CLI checks (simulated inventory, no native audio)
    shell: python3 ${{ github.workspace }}/.github/ci/lane_boundary.py shell python {0}
    run: |
      import os, subprocess, sys
      binary = 'target/debug/mixyard' + ('.exe' if os.name == 'nt' else '')
      subprocess.run([sys.executable, '-B', 'verification/policy_check.py', binary], check=True)
      subprocess.run([sys.executable, '-B', 'verification/policy_selfcheck.py', binary], check=True)
