name: network-codec-transport-linux-linked-codec-session
description: Explicit Linux payload from .github/workflows/network-codec-transport.yml / linux-linked-codec-session
runs:
  using: composite
  steps:
  - uses: actions/setup-python@v5
    if: runner.os == 'Linux'
    with:
      python-version: '3.13'
  - uses: actions/checkout@v4
  - uses: dtolnay/rust-toolchain@stable
    with:
      components: clippy
  - name: Source selector propagation regressions
    run: python3 -B -m unittest discover -s network -p test_codec_source_links.py -v
    shell: python3 ${{ github.workspace }}/.github/ci/lane_boundary.py shell bash {0}
  - name: Hosted codec link prerequisites
    run: sudo apt-get update && sudo apt-get install -y libzstd-dev libopus-dev
    shell: python3 ${{ github.workspace }}/.github/ci/lane_boundary.py shell bash {0}
  - name: Private target and space guard
    shell: python3 ${{ github.workspace }}/.github/ci/lane_boundary.py shell python {0}
    run: |
      import os, shutil
      assert shutil.disk_usage(os.environ['RUNNER_TEMP']).free >= 10 * 2**30
      with open(os.environ['GITHUB_ENV'], 'a') as env:
          env.write('CARGO_TARGET_DIR=' + os.path.join(os.environ['RUNNER_TEMP'], 'mixyard-linked-codec-transport') + '\n')
  - run: cargo clippy --locked --manifest-path network/Cargo.toml --features system-zstd,system-opus --all-targets
      -- -D warnings
    shell: python3 ${{ github.workspace }}/.github/ci/lane_boundary.py shell bash {0}
  - run: cargo test --locked --manifest-path network/Cargo.toml --features system-zstd,system-opus
    shell: python3 ${{ github.workspace }}/.github/ci/lane_boundary.py shell bash {0}
