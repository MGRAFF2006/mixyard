name: audio-core-pcm
description: Explicit Linux payload from .github/workflows/audio-core.yml / pcm
runs:
  using: composite
  steps:
  - uses: dtolnay/rust-toolchain@stable
    if: runner.os == 'Linux'
    with:
      components: rustfmt, clippy
  - uses: actions/checkout@v4
  - name: Actual processor PCM oracles and callback heap checks
    run: cargo test --locked --test audio_core --test audio_precision --test audio_allocations --test audio_clock
    shell: python3 ${{ github.workspace }}/.github/ci/lane_boundary.py shell bash {0}
  - name: Offline sample-render demonstration
    run: cargo test --locked --test audio_core offline_render_demo -- --nocapture
    shell: python3 ${{ github.workspace }}/.github/ci/lane_boundary.py shell bash {0}
  - name: Qualification boundary
    shell: python3 ${{ github.workspace }}/.github/ci/lane_boundary.py shell bash {0}
    run: echo 'Actual core sample processing only. Native delivery, device clocks, latency, quality and endurance
      remain unverified.' >> "$GITHUB_STEP_SUMMARY"
