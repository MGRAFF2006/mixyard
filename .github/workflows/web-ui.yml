name: Web console frontend checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'src/**'
      - 'observers/**'
      - 'adapters/linux/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/run-web.sh'
      - '.github/workflows/web-ui.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'src/**'
      - 'observers/**'
      - 'adapters/linux/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/run-web.sh'
      - '.github/workflows/web-ui.yml'

permissions:
  contents: read

concurrency:
  group: web-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Strict types, data safety, browser flows and build
    runs-on: boat
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Linux'
        with:
          components: rustfmt, clippy
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: '11.10.0'
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.13.1'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Build headless service and lifecycle binaries
        run: cargo build --locked --manifest-path ../../Cargo.toml --bins --jobs 2
      - name: Browser workflows against the production service and real store
        run: pnpm test:integration
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: web-ui-browser-evidence
          path: apps/web/test-results/
      - name: Evidence boundary
        run: echo 'Frontend and isolated browser checks, plus production assets with the actual Rust service/store and explicitly owned lifecycle runtime. No native audio, hardware delivery or quality qualification.' >> "$GITHUB_STEP_SUMMARY"
