        set -euo pipefail
        python3 .github/ci/lane_boundary.py restore
        rm -rf -- "${{ runner.temp }}/linux-lanes/audio-core-pcm"
    - name: Prepare automation-automation
      if: ${{ !cancelled() && steps.select.outputs.automation_automation == 'true' }}
      shell: bash
      env: &id005
        CARGO_BUILD_JOBS: '2'
        CARGO_PROFILE_DEV_DEBUG: '0'
        CARGO_INCREMENTAL: '0'
        LANE_ID: automation-automation
        LANE_PYTHON: 'false'
        LANE_NODE: 'false'
        LANE_PNPM: 'false'
        RUSTUP_TOOLCHAIN: stable
        RUNNER_TEMP: ${{ runner.temp }}/linux-lanes/automation-automation
