name: Linux fixtures
'on':
  pull_request: null
  push:
    branches:
    - main
    - t3/network-codecs
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: linux-fixtures-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixtures:
    name: Linux fixtures gate
    runs-on: boat-large
    timeout-minutes: 480
    concurrency:
      group: boat-ci
      cancel-in-progress: false
      queue: max
    outputs:
      core_present: ${{ steps.qualification_offline.outputs.core_present }}
      linux_present: ${{ steps.qualification_offline.outputs.linux_present }}
      windows_present: ${{ steps.qualification_offline.outputs.windows_present }}
      macos_present: ${{ steps.qualification_offline.outputs.macos_present }}
      qualification_success: ${{ steps.qualification_offline.outcome == 'success' }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Save pristine runner environment
      shell: bash
      run: python3 .github/ci/lane_boundary.py snapshot
    - name: Select Linux lanes conservatively
      id: select
      run: python3 .github/ci/select_linux_fixtures.py
    - name: Prepare qualification-offline
      if: ${{ !cancelled() && steps.select.outputs.qualification_offline == 'true' }}
      shell: bash
      env: &id001
        LANE_ID: qualification-offline
        LANE_PYTHON: 'true'
        LANE_NODE: 'false'
        LANE_PNPM: 'false'
        RUSTUP_TOOLCHAIN: stable
        RUNNER_TEMP: ${{ runner.temp }}/linux-lanes/qualification-offline
      run: mkdir -p "$RUNNER_TEMP"
    - name: qualification-offline
      id: qualification_offline
      if: ${{ !cancelled() && steps.select.outputs.qualification_offline == 'true' }}
      uses: ./.github/actions/linux-fixtures/qualification-offline
      env: *id001
      timeout-minutes: 5
      continue-on-error: true
    - name: Restore environment after qualification-offline
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        set -euo pipefail
        python3 .github/ci/lane_boundary.py restore
        rm -rf -- "${{ runner.temp }}/linux-lanes/qualification-offline"
    - name: Prepare qualification-core
      if: ${{ !cancelled() && steps.select.outputs.qualification_core == 'true' && steps.qualification_offline.outcome
        == 'success' && steps.qualification_offline.outputs.core_present == 'true' }}
      shell: bash
      env: &id002
        CARGO_BUILD_JOBS: '2'
        LANE_ID: qualification-core
        LANE_PYTHON: 'true'
        LANE_NODE: 'false'
        LANE_PNPM: 'false'
        RUSTUP_TOOLCHAIN: stable
        RUNNER_TEMP: ${{ runner.temp }}/linux-lanes/qualification-core
      run: mkdir -p "$RUNNER_TEMP"
    - name: qualification-core
      id: qualification_core
      if: ${{ !cancelled() && steps.select.outputs.qualification_core == 'true' && steps.qualification_offline.outcome
        == 'success' && steps.qualification_offline.outputs.core_present == 'true' }}
      uses: ./.github/actions/linux-fixtures/qualification-core
      env: *id002
      timeout-minutes: 10
      continue-on-error: true
    - name: Restore environment after qualification-core
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        set -euo pipefail
        python3 .github/ci/lane_boundary.py restore
        rm -rf -- "${{ runner.temp }}/linux-lanes/qualification-core"
    - name: Prepare qualification-linux
      if: ${{ !cancelled() && steps.select.outputs.qualification_linux == 'true' && steps.qualification_offline.outcome
        == 'success' && steps.qualification_offline.outputs.linux_present == 'true' }}
      shell: bash
      env: &id003
        LANE_ID: qualification-linux
        LANE_PYTHON: 'true'
        LANE_NODE: 'false'
        LANE_PNPM: 'false'
        RUSTUP_TOOLCHAIN: stable
        RUNNER_TEMP: ${{ runner.temp }}/linux-lanes/qualification-linux
      run: mkdir -p "$RUNNER_TEMP"
    - name: qualification-linux
      id: qualification_linux
      if: ${{ !cancelled() && steps.select.outputs.qualification_linux == 'true' && steps.qualification_offline.outcome
        == 'success' && steps.qualification_offline.outputs.linux_present == 'true' }}
      uses: ./.github/actions/linux-fixtures/qualification-linux
      env: *id003
      timeout-minutes: 5
      continue-on-error: true
    - name: Restore environment after qualification-linux
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        set -euo pipefail
        python3 .github/ci/lane_boundary.py restore
        rm -rf -- "${{ runner.temp }}/linux-lanes/qualification-linux"
    - name: Prepare audio-core-pcm
      if: ${{ !cancelled() && steps.select.outputs.audio_core_pcm == 'true' }}
      shell: bash
      env: &id004
        CARGO_BUILD_JOBS: '2'
        LANE_ID: audio-core-pcm
        LANE_PYTHON: 'false'
        LANE_NODE: 'false'
        LANE_PNPM: 'false'
        RUSTUP_TOOLCHAIN: stable
