        set -euo pipefail
        python3 .github/ci/lane_boundary.py restore
        rm -rf -- "${{ runner.temp }}/linux-lanes/windows-worker-portable"
    - name: Require every applicable selected lane
      if: ${{ !cancelled() }}
      env:
        SELECTED: ${{ toJSON(steps.select.outputs) }}
        OUTCOMES: ${{ toJSON(steps) }}
      shell: bash
      run: python3 .github/ci/require_linux_fixtures.py
    - name: Remove ephemeral environment snapshot
      if: ${{ always() }}
      shell: bash
      run: python3 .github/ci/lane_boundary.py clean
  qualification-core:
    name: Core policy build/tests (${{ matrix.os }}, no native audio)
    needs: fixtures
    if: always() && !cancelled() && github.event_name != 'workflow_dispatch' && needs.fixtures.outputs.qualification_success == 'true' && needs.fixtures.outputs.core_present
      == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
        - windows-latest
        - macos-latest
    runs-on: ${{ startsWith(matrix.os, 'ubuntu-') && 'boat' || matrix.os }}
    concurrency:
      group: ${{ startsWith(matrix.os, 'ubuntu-') && 'boat-ci' || format('boat-ci-native-{0}-{1}-core-{2}', github.run_id,
        github.run_attempt, strategy.job-index) }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: 2
    steps:
    - uses: dtolnay/rust-toolchain@stable
      if: runner.os == 'Linux'
      with:
        components: rustfmt, clippy
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Disk prerequisite (at least 10 GiB)
      shell: python
      run: |
        import shutil
        free = shutil.disk_usage('.').free
        print(f'Available: {free / 2**30:.1f} GiB')
        if free < 10 * 2**30:
            raise SystemExit('BLOCKED: less than 10 GiB free before build')
    - name: Root core package tests only
      run: cargo test --locked --manifest-path Cargo.toml --package mixyard
    - name: Build policy CLI for independent black-box checks
      run: cargo build --locked --manifest-path Cargo.toml --package mixyard
    - name: Independent policy CLI checks (simulated inventory, no native audio)
      shell: python
      run: |
        import os, subprocess, sys
        binary = 'target/debug/mixyard' + ('.exe' if os.name == 'nt' else '')
        subprocess.run([sys.executable, '-B', 'verification/policy_check.py', binary], check=True)
        subprocess.run([sys.executable, '-B', 'verification/policy_selfcheck.py', binary], check=True)
  qualification-windows:
    name: Windows native compile and buffer model (no devices)
    needs: fixtures
    if: always() && !cancelled() && github.event_name != 'workflow_dispatch' && needs.fixtures.outputs.qualification_success == 'true' && needs.fixtures.outputs.windows_present
      == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Disk prerequisite (at least 10 GiB)
      shell: python
      run: |
        import shutil
        if shutil.disk_usage('.').free < 10 * 2**30:
            raise SystemExit('BLOCKED: less than 10 GiB free before build')
    - name: Configure native MSVC backend
      run: cmake -S adapters/windows -B build/windows -A x64
    - name: Compile native capture probe and model
      run: cmake --build build/windows --config Release --target mixyard-windows-probe mixyard-windows-model-check
    - name: Buffer/WAV model only (not WASAPI or endpoint injection)
      run: ctest --test-dir build/windows -C Release -R '^windows-buffer-wav-model$' --output-on-failure --no-tests=error
  qualification-macos:
    name: macOS native compile (no permissions, capture or HAL)
    needs: fixtures
    if: always() && !cancelled() && github.event_name != 'workflow_dispatch' && needs.fixtures.outputs.qualification_success == 'true' && needs.fixtures.outputs.macos_present
      == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Compile Core Audio probe with SDK/disk preflight
      run: bash adapters/macos/build.sh
