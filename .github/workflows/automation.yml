name: Situation decision core (explicit observations)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'src/lib.rs', 'src/automation/**', 'src/bin/mixyard-automation.rs', 'tests/automation*', 'examples/automation/**', 'docs/automation*.md', '.github/workflows/automation.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'src/lib.rs', 'src/automation/**', 'src/bin/mixyard-automation.rs', 'tests/automation*', 'examples/automation/**', 'docs/automation*.md', '.github/workflows/automation.yml']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automation:
    name: Evaluator, proposals and transition lifecycle
    runs-on: boat
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Linux'
        with:
          components: rustfmt, clippy
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --test automation_core --test automation_cli --test automation_controller --test automation_observers
      - run: cargo clippy --locked --lib --bin mixyard-automation --test automation_core --test automation_cli --test automation_controller --test automation_observers -- -D warnings
      - run: cargo run --locked --bin mixyard-automation -- evaluate examples/automation/interface-monitor.json
