name: Authenticated codec transport

on:
  pull_request:
    paths: ['network/**', 'docs/network-codec-transport.md', '.github/workflows/network-codec-transport.yml']
  push:
    branches: [main]
    paths: ['network/**', 'docs/network-codec-transport.md', '.github/workflows/network-codec-transport.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw-codec-session:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Private target and space guard
        shell: python
        run: |
          import os, shutil
          assert shutil.disk_usage(os.environ['RUNNER_TEMP']).free >= 10 * 2**30
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('CARGO_TARGET_DIR=' + os.path.join(os.environ['RUNNER_TEMP'], 'mixyard-codec-transport') + '\n')
      - run: cargo fmt --manifest-path network/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path network/Cargo.toml --features codecs --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path network/Cargo.toml --features codecs
      - run: cargo test --locked --manifest-path network/Cargo.toml --no-default-features

  linux-linked-codec-session:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Source selector propagation regressions
        run: python3 -B -m unittest discover -s network -p test_codec_source_links.py -v
      - name: Hosted codec link prerequisites
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev libopus-dev
      - name: Private target and space guard
        shell: python
        run: |
          import os, shutil
          assert shutil.disk_usage(os.environ['RUNNER_TEMP']).free >= 10 * 2**30
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('CARGO_TARGET_DIR=' + os.path.join(os.environ['RUNNER_TEMP'], 'mixyard-linked-codec-transport') + '\n')
      - run: cargo clippy --locked --manifest-path network/Cargo.toml --features system-zstd,system-opus --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path network/Cargo.toml --features system-zstd,system-opus
