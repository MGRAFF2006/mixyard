name: HTTP and UPnP loopback adapters

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owned-loopback:
    # Automatic Linux execution belongs to linux-fixtures.yml.
    if: github.event_name == 'workflow_dispatch'
    runs-on: boat
    # Keep queued checks while sharing one repository-wide Boat slot.
    concurrency:
      group: boat-ci
      cancel-in-progress: false
      queue: max
    timeout-minutes: 3
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: interoperability
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s interoperability/tests/http_upnp -v
