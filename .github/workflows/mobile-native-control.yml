name: Production mobile native control
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/mobile/**', 'verification/mobile-native/**', 'apps/web/src/dsp-json.ts', '.github/workflows/mobile-native-control.yml']
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'verification/mobile-native/**', '.github/workflows/mobile-native-control.yml']
permissions:
  contents: read
concurrency:
  group: native-mobile-control-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift-resolver-lock:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: PREPARATION ONLY generate missing real CLI and Xcode resolver locks
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f apps/mobile/ios/Package.resolved || ! -f apps/mobile/ios/Mixyard.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved ]]; then
            echo 'preparation=true' >> "$GITHUB_OUTPUT"
            swift package --package-path apps/mobile/ios --scratch-path "$RUNNER_TEMP/trust-resolver" resolve
            xcodebuild -resolvePackageDependencies -project apps/mobile/ios/Mixyard.xcodeproj -scheme Mixyard -derivedDataPath "$RUNNER_TEMP/trust-xcode-resolver"
          fi
          python3 -B verification/mobile-native/swift-package-lock.py --xcode
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mobile-control-trust-resolver-locks
          include-hidden-files: true
          path: |
            apps/mobile/ios/Package.resolved
            apps/mobile/ios/Mixyard.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Require committed resolver provenance before any qualification
        if: steps.lock.outputs.preparation == 'true'
        run: |
          echo 'PREPARATION ONLY: commit both real resolver locks, then qualify the new locked HEAD. No native test pass claimed.'
          exit 1
  kotlin-production-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v7
        with:
          ref: b3731ce51af02cfbcd0ad6fb7080694f08b6a0bd
          path: .qualification-control
      - uses: actions/setup-node@v7
        with:
          node-version: '24.13.1'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/native-control-gradle
        with:
          gradle-version: '8.11.1'
      - name: Bounded qualifier readiness and owned-process lifecycle
        run: |
          node --test verification/mobile-native/lifecycle.test.ts verification/mobile-native/certificate-fixture.test.ts
          python3 -B -m unittest discover -s verification/mobile-native -p 'test_*.py'
      - name: Compile unchanged shipping Kotlin client with only vault boundary double
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/native-control-gradle
        shell: bash
        run: |
          mkdir -p verification/mobile-native/kotlin/build/production
          cp apps/mobile/android/app/src/main/java/org/mixyard/mobile/PinnedControl.kt verification/mobile-native/kotlin/build/production/
          cp apps/mobile/android/core/src/main/kotlin/org/mixyard/mobile/Endpoint.kt verification/mobile-native/kotlin/build/production/
          sha256sum apps/mobile/android/app/src/main/java/org/mixyard/mobile/PinnedControl.kt verification/mobile-native/kotlin/build/production/PinnedControl.kt
          gradle --no-daemon -p verification/mobile-native/kotlin installDist
      - uses: actions/upload-artifact@v6
        with:
          name: mobile-native-http-dependency-locks
          path: |
            verification/mobile-native/kotlin/gradle.lockfile
            apps/mobile/android/http/gradle.lockfile
      - name: Build pinned production control service
        run: cargo build --locked --manifest-path .qualification-control/control/Cargo.toml --bin mixyard-control --jobs 2
      # Historical scoped409 causal RED is preserved in prior92 evidence. Its
      # PIN-only source cannot implement this new production OOB input contract.
      - name: Actual Kotlin JSSE and shipping pin/dispatch/serializer against actual TLS services
        env:
          MIXYARD_CONTROL_BINARY: ${{ github.workspace }}/.qualification-control/control/target/debug/mixyard-control
          MIXYARD_NATIVE_COMMAND: '["bash","verification/mobile-native/run-jvm.sh"]'
        run: node --test --test-concurrency=1 verification/mobile-native/control.test.ts verification/mobile-native/public-policy.test.ts
      - name: Record production anchor source identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oob-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/oob-evidence/source-head.txt"
          git ls-files 'apps/mobile/android/http/**' 'apps/mobile/android/app/src/main/java/org/mixyard/mobile/PinnedControl.kt' 'apps/mobile/ios/App/ControlClient.swift' 'apps/mobile/ios/App/CredentialStore.swift' 'apps/mobile/ios/Package.swift' 'apps/mobile/ios/Package.resolved' 'apps/mobile/ios/Sources/MobileControlTrust/**' 'verification/mobile-native/**' | while IFS= read -r file; do shasum -a 256 "$file"; done > "$RUNNER_TEMP/oob-evidence/source-sha256.txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mobile-oob-kotlin-source
          path: ${{ runner.temp }}/oob-evidence
      - if: always()
        run: echo 'Production Kotlin client + real JSSE single-OOB-anchor PKI/pin/HTTP. JVM vault platform double, not Android Keystore or physical device qualification. PCM/audio roles remain unavailable.' >> "$GITHUB_STEP_SUMMARY"
  swift-production-tls:
    needs: swift-resolver-lock
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: /Applications/Xcode_16.4.app/Contents/Developer
            label: xcode16-4
          - runner: macos-14
            xcode: /Applications/Xcode_16.2.app/Contents/Developer
            label: xcode16-2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v7
        with:
          ref: b3731ce51af02cfbcd0ad6fb7080694f08b6a0bd
          path: .qualification-control
      - uses: actions/setup-node@v7
        with:
          node-version: '24.13.1'
      - name: Bounded qualifier readiness and owned-process lifecycle
        run: |
          node --test verification/mobile-native/lifecycle.test.ts verification/mobile-native/certificate-fixture.test.ts
          python3 -B -m unittest discover -s verification/mobile-native -p 'test_*.py'
      # Exact5d LF RED/current a70 LF+CRLF GREEN is retained as historical
      # executed evidence in PR113. Do not misclassify a new module-layout
      # compile failure of old source as causal proof.
      - name: Compile shipping Swift client and platform test driver
        run: bash verification/mobile-native/build-swift.sh
      - name: Current shipping Swift LF and CRLF positive preflight and fixed diagnostics
        env:
          MIXYARD_NATIVE_COMMAND: '["bash","verification/mobile-native/run-swift-anchor.sh"]'
        run: node --test verification/mobile-native/swift-preflight.test.ts
      - name: Build pinned production control service
        run: cargo build --locked --manifest-path .qualification-control/control/Cargo.toml --bin mixyard-control --jobs 2
      - name: Actual Swift URLSession and shipping Security pin/dispatch/serializer against actual TLS services
        env:
          MIXYARD_CONTROL_BINARY: ${{ github.workspace }}/.qualification-control/control/target/debug/mixyard-control
          MIXYARD_NATIVE_COMMAND: '["bash","verification/mobile-native/run-swift-anchor.sh"]'
        run: node --test --test-concurrency=1 verification/mobile-native/control.test.ts verification/mobile-native/public-policy.test.ts
      - name: Record production anchor source identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oob-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/oob-evidence/source-head.txt"
          git ls-files 'apps/mobile/android/http/**' 'apps/mobile/android/app/src/main/java/org/mixyard/mobile/PinnedControl.kt' 'apps/mobile/ios/App/ControlClient.swift' 'apps/mobile/ios/App/CredentialStore.swift' 'apps/mobile/ios/Package.swift' 'apps/mobile/ios/Package.resolved' 'apps/mobile/ios/Sources/MobileControlTrust/**' 'verification/mobile-native/**' | while IFS= read -r file; do shasum -a 256 "$file"; done > "$RUNNER_TEMP/oob-evidence/source-sha256.txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mobile-oob-swift-source-${{ matrix.label }}
          path: ${{ runner.temp }}/oob-evidence
      - if: always()
        run: echo 'Production Swift client + real URLSession/Security single-OOB-anchor PKI/pin/HTTP; ZERO user/admin trust or keychain mutation. Vault platform double, not iPhone Keychain/device-lock or physical qualification. PCM/audio roles remain unavailable.' >> "$GITHUB_STEP_SUMMARY"
  android-shipping-http-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile actual Android application with identical shipping HTTP module
        working-directory: apps/mobile/android
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/android-shipping-http-gradle
        run: |
          gradle --no-daemon :app:assembleDebug :app:lintDebug
          gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath
      - uses: actions/upload-artifact@v6
        with:
          name: mobile-android-http-dependency-locks
          path: apps/mobile/android/app/gradle.lockfile
      - if: always()
        run: echo 'Actual Android SDK application compilation/lint with the same shipping HTTP engine. No Android runtime/emulator/physical secure-storage execution is claimed.' >> "$GITHUB_STEP_SUMMARY"
