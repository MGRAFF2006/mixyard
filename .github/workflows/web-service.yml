name: Loopback web service
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'src/**', 'tests/web*', 'tests/web_support/**', 'tests/runtime_inventory.rs', 'observers/**', 'adapters/linux/**', '.github/workflows/web-service.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'src/**', 'tests/web*', 'tests/web_support/**', 'tests/runtime_inventory.rs', 'observers/**', 'adapters/linux/**', '.github/workflows/web-service.yml']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  http:
    name: Real HTTP and profile persistence (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ startsWith(matrix.os, 'ubuntu-') && 'boat' || matrix.os }}
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Linux'
        with:
          components: rustfmt, clippy
      - uses: actions/checkout@v4
      - name: Formatting
        run: cargo fmt --all --check
      - name: Core and service checks
        run: cargo test --locked --lib --bins --test web_service --test web_activation --test profiles_cli --test diagnostics_cli --test automation_core --test automation_controller --test automation_settings --test context --test runtime_readonly
      - name: Clippy (existing web reply error-size allowance)
        run: cargo clippy --locked --all-targets -- -D warnings -A clippy::result_large_err
      - name: Preserve locked resolution of all path-dependent consumers
        run: |
          cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > desktop-metadata.json
          cargo metadata --locked --manifest-path verification/desktop-inspection/Cargo.toml --format-version 1 > inspection-metadata.json
          cargo metadata --locked --manifest-path verification/desktop-profiles/Cargo.toml --format-version 1 > profiles-metadata.json
