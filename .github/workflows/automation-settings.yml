name: Durable situation settings
on:
  workflow_dispatch:
  push:
    paths: ['Cargo.toml', 'Cargo.lock', 'src/lib.rs', 'src/store_fs.rs', 'src/profiles/**', 'src/profiles.rs', 'src/automation/**', 'src/context.rs', 'tests/automation*', 'tests/profiles_cli.rs', 'tests/context.rs', 'docs/automation-settings.md', '.github/workflows/automation-settings.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'src/lib.rs', 'src/store_fs.rs', 'src/profiles/**', 'src/profiles.rs', 'src/automation/**', 'src/context.rs', 'tests/automation*', 'tests/profiles_cli.rs', 'tests/context.rs', 'docs/automation-settings.md', '.github/workflows/automation-settings.yml']
permissions:
  contents: read
jobs:
  settings:
    name: Settings filesystem and profile regressions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Require 10 GiB free
        shell: python
        run: |
          import os, shutil
          if shutil.disk_usage(os.environ['RUNNER_TEMP']).free < 10 * 2**30:
              raise SystemExit('Less than 10 GiB free before settings build')
      - name: Use isolated temporary build directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/mixyard-settings-target" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --lib --test automation_settings --test automation_core --test automation_cli --test profiles_cli --test context
      - run: cargo clippy --locked --lib --test automation_settings --test automation_core --test automation_cli --test profiles_cli --test context -- -D warnings
