name: Windows linked Rust native host (injected endpoints only)
on:
  workflow_dispatch:
  push:
    paths: ['adapters/windows/**', 'adapters/engine/**', 'src/audio/**', 'src/audio.rs', 'src/dsp.rs', 'src/dsp/**', 'src/lib.rs', 'src/worker/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/windows-native-host.yml']
  pull_request:
    paths: ['adapters/windows/**', 'adapters/engine/**', 'src/audio/**', 'src/audio.rs', 'src/dsp.rs', 'src/dsp/**', 'src/lib.rs', 'src/worker/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/windows-native-host.yml']
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '1'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  linked:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select private disposable Rust target
        shell: pwsh
        run: "'CARGO_TARGET_DIR=' + $env:RUNNER_TEMP + '/mixyard-windows-linked-host-rust' >> $env:GITHUB_ENV"
      - name: Require disposable runner reserve before building
        shell: python
        run: |
          import shutil
          if shutil.disk_usage('.').free < 10 * 2**30:
              raise SystemExit('BLOCKED: less than 10 GiB free on disposable runner')
      - name: Build actual shared canonical Rust host
        if: runner.os == 'Linux'
        run: cargo build --manifest-path adapters/engine/Cargo.toml --locked --release --jobs 1
      - name: Configure portable linked production boundary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S adapters/windows/native-host -B "$RUNNER_TEMP/mixyard-windows-host-cpp" -DCMAKE_BUILD_TYPE=Release -DMIXYARD_HOST_LIBRARY="$CARGO_TARGET_DIR/release/libmixyard_host.a"
      - name: Configure SDK-linked production boundary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildOutput = & cargo rustc --manifest-path adapters/engine/Cargo.toml --locked --release --lib -- --print native-static-libs 2>&1
          if ($LASTEXITCODE -ne 0) { $buildOutput | Write-Output; exit $LASTEXITCODE }
          $buildOutput | Write-Output
          $nativeLine = $buildOutput | ForEach-Object { "$_" } | Where-Object { $_ -match 'native-static-libs:' } | Select-Object -Last 1
          if (!$nativeLine) { throw 'Rust toolchain did not report required native link libraries' }
          $nativeLibraries = (($nativeLine -replace '^.*native-static-libs:\s*', '').Trim() -split '\s+') -join ';'
          cmake -S adapters/windows/native-host -B "$env:RUNNER_TEMP/mixyard-windows-host-cpp" -A x64 "-DMIXYARD_HOST_LIBRARY=$env:CARGO_TARGET_DIR/release/mixyard_host.lib" "-DMIXYARD_HOST_NATIVE_LIBRARIES=$nativeLibraries"
      - name: Build Windows production bridge and consumer oracle
        shell: pwsh
        run: cmake --build "$env:RUNNER_TEMP/mixyard-windows-host-cpp" --config Release --parallel 1
      - name: Exercise linked queues and injected SDK endpoints only
        shell: pwsh
        run: ctest --test-dir "$env:RUNNER_TEMP/mixyard-windows-host-cpp" -C Release --output-on-failure --no-tests=error
      - name: State exact qualification boundary
        shell: pwsh
        run: |
          'Actual Rust planner/Processor64 plus production C++ SPSC/consumer byte oracle. Windows SDK endpoints and driver operations are injected; no physical audio/driver/default/service APIs execute. Physical clocks, native app identities, selectable microphones and backend availability remain unqualified/false.' >> $env:GITHUB_STEP_SUMMARY
