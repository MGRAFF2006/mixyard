name: Authenticated control security

on:
  pull_request:
    paths: ['control/**', 'src/web/**', 'src/profiles.rs', 'src/store_fs.rs', 'src/automation/**', 'docs/remote-control.md', '.github/workflows/control-security.yml']
  push:
    branches: [main]
    paths: ['control/**', 'src/web/**', 'src/profiles.rs', 'src/store_fs.rs', 'src/automation/**', 'docs/remote-control.md', '.github/workflows/control-security.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-tls-security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path control/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path control/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path control/Cargo.toml
