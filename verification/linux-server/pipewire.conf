# Private unprivileged daemon only: no hardware, DBus, host runtime or defaults.
context.properties = {
    core.daemon = true
    core.name = mixyard-server-private
    support.dbus = false
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum = 256
    default.clock.min-quantum = 256
    default.clock.max-quantum = 256
    default.clock.quantum-limit = 2048
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-access args = { access.socket = { mixyard-server-private = "unrestricted" } } }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-session-manager }
    { name = libpipewire-module-mixyard-server-proof args = {
        consent.path = /private/consent
        control.path = /private/control.sock
        fixture.sources = true
    } }
]
context.objects = [
    { factory = spa-node-factory args = {
        factory.name = support.node.driver node.name = Private-Dummy-Driver
        node.group = pipewire.dummy priority.driver = 200000
    } }
]
